# Servizi docker 
services:
  # ---- Backend (Go API) ----
  backend:
    container_name: wasatext-backend
    build: # builda l'immagine prendendo come base Dockerfile.backend
      context: .
      dockerfile: Dockerfile.backend
    ports: # mappa la porta dell'host su quella del container backend
      - "3000:3000" 
    volumes: # monta il database all'interno del container garantendo la persistenza dei dati
      - ./cmd/webapi/wasatext.db:/tmp/wasatext.db
    restart: unless-stopped # riavvia il container se si arresta in modo anomalo

  # ---- Frontend (Vue.js + Nginx) ----
  frontend:
    container_name: wasatext-frontend
    build: # builda l'immagine prendendo come base Dockerfile.frontend
      context: .
      dockerfile: Dockerfile.frontend
    ports: # mappa la porta 4173 dell'host sulla porta 80 di Nginx nel container
      - "4173:80"
    depends_on: # attende che il container backend sia avviato
      - backend
    restart: unless-stopped # riavvia il container se si arresta in modo anomalo
