openapi: 3.0.0
info:
  title: WASAText
  description: |
    Messaging platform that supports individual and group chats, accessible via PC.
  version: 1.0.0

servers:
  - url: /
    description: WASAText API server

components:
  schemas:
    User:
      description: User object
      type: object
      properties:
        userId: 
          $ref: '#/components/schemas/GeneralId'
        name:
          type: string
          description: User nickname
          example: "Luca"
          pattern: '^(?=.*\S).+$'
          minLength: 3
          maxLength: 25
        photo:
          $ref: '#/components/schemas/Photo'
      required:
        - userId
    
    Username:
      description: Username object
      type: object
      properties:
        username:
          type: string
          description: User nickname
          pattern: '^(?=.*\S).+$'
          minLength: 3
          maxLength: 25
          example: "Luca"
      required:
        - username
    
    Photo:
      description: User or group profile photo
      type: object
      properties:
        url:
          type: string
          description: URL of the photo
          format: url
          pattern: '^(?=.*\S).+$'
          minLength: 1
          maxLength: 1000
          example: "https://foto.com/foto.png"
          
    GeneralId:
      description: Defines the format for identifiers
      type: string
      example: "avfd457ud3"
      minLength: 3
      maxLength: 16
      pattern: '^(?=.*\S).+$'
          
    ChatList:
      description: Chat list in reverse chronological order
      type: object
      properties:
        chats:
          description: List of chats preview
          type: array
          minItems: 0
          maxItems: 1000
          items:
            $ref: '#/components/schemas/ChatPreview'
        
    ChatPreview:
      description: |
        Chat preview object showing name, photo, last message and its sending time
      type: object
      properties:
        chatId:
          $ref: '#/components/schemas/GeneralId'
        name:
          type: string
          description: Chat name (user nickname or group name)
          pattern: '^(?=.*\S).+$'
          minLength: 3
          maxLength: 25
          example: "Luca"
        photo:
          $ref: '#/components/schemas/Photo'
        lastMessage:
          $ref: '#/components/schemas/Message'
        lastMessageTime:
          type: string
          minLength: 1
          maxLength: 100
          description: Message sending time
          format: date-time
          pattern: '^(?=.*\S).+$'
        isGroup:
          type: boolean
          description: True if the chat is a group chat, false if it is a single chat
        hasUnread:
          type: boolean
          description: True if the chat has unread messages, false if it has no unread messages
        unreadCount:
          type: integer
          description: Number of unread messages
          example: 1
          minimum: 0
          maximum: 100
        lastMessageUserId:
          $ref: '#/components/schemas/GeneralId'
        
    Message:
      description: Message object
      type: object
      properties: 
        id:
          $ref: '#/components/schemas/GeneralId'
        sender:
          $ref: '#/components/schemas/GeneralId'
        chatId:
          $ref: '#/components/schemas/GeneralId'
        text:
          type: string
          description: Message content
          pattern: '^(?=.*\S).+$'
          example: "ciao"
          minLength: 1
          maxLength: 1000
        instant:
          type: string
          minLength: 1
          maxLength: 100
          description: Message sending time
          format: date-time
          pattern: '^(?=.*\S).+$'
        comments:
          type: array
          description: List of reactions to the message
          minItems: 0
          maxItems: 100
          items:
            $ref: '#/components/schemas/Comment'
        state:
          type: integer
          description: Message state (1 = received, 2 = read)
          enum: 
            - 1
            - 2
        forwarded:
          type: boolean
          description: Defines if the message is forwarded (true = forwarded, false = no)
        reply:
          type: boolean
          description: Defines if the message is a reply to another message
        replyTo:
          $ref: '#/components/schemas/GeneralId'
          description: ID of the message being replied to
        senderUsername:
          type: string
          description: Username of the sender
          example: "Luca"
        deleted:
          type: boolean
          description: True if the message has been deleted, false otherwise
      required:
        - text
       
    
    Comment:
      description: Reaction object
      type: object
      properties:
        id: 
          $ref: '#/components/schemas/GeneralId'
        sender:
          $ref: '#/components/schemas/GeneralId'
        senderUsername:
          type: string
          description: Username of the sender of the reaction
          example: "Luca"
        emoji:
          type: string
          description: Emoji used to react to the message
          example: "👍"
          pattern: '^[^\\s]{1,10}$'
          minLength: 1
          maxLength: 10
        messageId:
          $ref: '#/components/schemas/GeneralId'
      required: 
        - emoji
    
    Messages:
      description: List of messages of the conversation
      type: array
      minItems: 0
      maxItems: 1000
      items:
        $ref: '#/components/schemas/Message'
        
    Chat:
      description: Generic chat object (single or group chat)
      type: object
      properties:
        chatId: 
          $ref: '#/components/schemas/GeneralId'
        isGroup:
          type: boolean
          description: True if the chat is a group chat, false if it is a single chat
        name:
          type: string
          description: Chat name (user nickname or group name)
          pattern: '^(?=.*\S).+$'
          minLength: 3
          maxLength: 25
          example: "Luca"
        photo:
          type: string
          description: Chat profile photo URL
          example: "https://foto.com/foto.png"
        participants:
          type: array
          description: List of participants in the chat
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/Username'
        messages:
          type: array
          description: List of messages in the chat
          minItems: 0
          maxItems: 1000
          items:
            $ref: '#/components/schemas/Message'
  
    Error:
      description: Response subject for error codes
      type: object
      properties:
        code:
          description: Error code
          type: string
          pattern: '^(?=.*\S).+$'
          example: "Bad Request"
          minLength: 3
          maxLength: 50
        message:
          description: Error message
          type: string
          pattern: '^(?=.*\S).+$'
          example: "Missing request"
          minLength: 3
          maxLength: 100
          
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
          
  parameters:
    messageIdParam:
      name: messageId
      in: path
      description: Message identifier
      required: true
      schema:
        $ref: '#/components/schemas/GeneralId'
    
    commentIdParam:
      name: commentId
      in: path
      description: Reaction identifier
      required: true
      schema:
        $ref: '#/components/schemas/GeneralId'
    
    chatIdParam:
      name: chatId
      in: path
      description: Chat identifier
      required: true
      schema: 
        $ref: '#/components/schemas/GeneralId'
        
        
  responses:
    BadRequest:
      description: Missing request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
            
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
            
    UnauthorizedError:
      description: Access token is missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflicting resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: No authorization
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      
security:
  - bearerAuth: []

tags:
  - name: "login"
    description: "Login operations"
  - name: "user"
    description: "User operations"
  - name: "chat"
    description: "Chat operations"
  - name: "message"
    description: "Message operations"
  - name: "comment"
    description: "Comment operations"
  - name: "group"
    description: "Group operations"


paths:
  /session:
    post:
      tags: ["login"]
      operationId: doLogin
      summary: Logs in the user
      description: |
        If the user does not exist, it will be created,
        and an identifier is returned.
        If the user exists, the user identifier is returned
      requestBody:
        description: User details
        required: true
        content:
          application/json:
            schema:
              description: Login request body
              type: object
              properties:
                name:
                  description: User nickname
                  type: string
                  example: Maria
                  pattern: '^[A-Za-z0-9]+$'
                  minLength: 3
                  maxLength: 16
      responses:
        "200":
          description: The user has logged in
          content:
            application/json:
              schema:
                description: User identifier response
                type: object
                properties:
                  token:
                    $ref: '#/components/schemas/GeneralId'
              example:
                token: "avfd457ud3"
        "201":
          description: The user has been created and has logged in.
          content:
            application/json:
              schema:
                description: Created user identifier response
                type: object
                properties:
                  token:
                    $ref: '#/components/schemas/GeneralId'
              example:
                token: "avfd457ud3"
        "400":
          $ref: '#/components/responses/BadRequest'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /me:
    get:
      tags: ["user"]
      operationId: getMyInformation
      summary: Returns current user profile
      description: |
        Returns the profile information of the currently authenticated user
      responses:
        "200":
          description: User profile returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                userId: "avfd457ud3"
                name: "Luca"
                photo: "https://foto.com/foto.png"
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "500":
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: []
                
  /me/username: 
    patch:
      tags: ["user"]
      operationId: setMyUserName
      summary: Update the user's nickname
      description: |
        Update the user's nickname and returns it
      requestBody:
        description: |
          New nickname to be replaced with the old one
        required: true
        content:
          application/json:
            schema:
              description: New username request body
              type: object
              properties:
                name:
                  description: New nickname
                  type: string
                  minLength: 3
                  maxLength: 25
                  pattern: '^[A-Za-z0-9]+$'
                  example: "NewUsername"
      responses:
        "200":
          description: Update successful and nickname returned
          content:
            application/json:
              schema:
                description: Updated username response body
                type: object
                properties:
                  name:
                    description: Updated nickname
                    type: string
                    minLength: 3
                    maxLength: 25
                    pattern: '^[A-Za-z0-9]+$'
                    example: "NewUsername"
              example:
                name: "NewUsername"
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalServerError'
      
      security:
        - bearerAuth: []
             
                
  /me/photo:
    put:
      tags: ["user"]
      operationId: setMyPhoto
      summary: Update the user's photo
      description: |
        Update the user's photo and returns it
      requestBody:
        description: New photo to be replaced with the old one 
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Photo'
      responses:
        "200":
          description: Photo updated successfully
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/Photo'
              example:
                url: "https://foto.com/foto.png"
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "500":
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: []

  /users/{username}:
    get:
      tags: ["user"]
      operationId: searchUser
      summary: Search user by username
      description: |
        Search a user by username and return the user profile
      parameters:
        - name: username
          in: path
          description: Username of the user to search
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 25
            example: "Luca"
      responses:
        "200":
          description: User found successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                userId: "avfd457ud3"
                name: "Luca"
                photo: "https://foto.com/foto.png"
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: []

  /chats:
    get:
      tags: ["chat"]
      operationId: getMyConversations
      summary: List all chats
      description: |
        Lists all the user's chats in reverse chronological order
      responses:
        "200":
          description: Chat list returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatList'
              example:
                chats:
                - chatId: "avfd457ud3"
                  name: "Luca"
                  photo:
                    url: "https://foto.com/foto.png"
                  lastMessage:
                    id: "avfd457ud3"
                    sender: "avfd457ud3"
                    chatId: "avfd457ud3"
                    text: "ciao"
                    instant: "2026-09-08T22:00:00Z"
                    state: 1
                    forwarded: false
                  lastMessageTime: "2026-09-08T22:00:00Z"
                  isGroup: false
                  hasUnread: true
                  unreadCount: 1
                  lastMessageUserId: "avfd457ud3"
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "500":
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: []

    post:
      tags: ["chat"]
      operationId: createChat
      summary: Create a chat
      description: |
        Create a chat with a specific user or group
      requestBody:
        description: User or group to create a chat with
        required: true
        content:
          application/json:
            schema:
              description: Parameters to create a conversation (direct 1-to-1 chat or group chat)
              type: object
              properties:
                id:
                  $ref: '#/components/schemas/GeneralId'
                isGroup:
                  description: True for group chat, false for direct 1-to-1 chat
                  type: boolean
                name:
                  description: Recipient username for direct 1-to-1 chat or group name for group chat
                  type: string
                  pattern: '^(?=.*\S).+$'
                  minLength: 3
                  maxLength: 25
                  example: "Luca"
                photo:
                  description: Group profile photo URL (optional)
                  type: string
                  example: "https://foto.com/foto.png"
                participants:
                  description: List of group members (username objects) to add to the group chat
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    $ref: '#/components/schemas/Username'
      responses:
        "201":
          description: Chat created successfully and returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'
              example:
                chatId: "avfd457ud3"
                isGroup: false
                name: "Luca"
                photo: "https://foto.com/foto.png"
                participants:
                  - username: "Luca"
                messages: []
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "500":
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: []
  
                
  /chats/{chatId}/messages:
    parameters:
      - $ref: '#/components/parameters/chatIdParam'
    get:
      tags: ["message"]
      operationId: getConversation
      summary:  Returns the messages of a chat
      description: |
        Returns the messages of a group or a chat with a specific user
      responses:
        "200":
          description: Messages returned successfully
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/Messages'
              example:
                - id: "avfd457ud3"
                  sender: "avfd457ud3"
                  senderUsername: "Luca"
                  chatId: "avfd457ud3"
                  text: "ciao"
                  instant: "2026-09-08T22:00:00Z"
                  state: 1
                  forwarded: false
                  deleted: false
                  comments: []
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: []
     
    post:
      tags: ["message"]
      operationId: sendMessage
      summary: Send a message
      description: |
        Send a message in chat
      requestBody:
        description: Message to send
        required: true
        content: 
          application/json:
            schema:
              description: Message object to send
              type: object
              properties:
                text:
                  description: Message content
                  type: string
                  pattern: '^(?=.*\S).+$'
                  example: "ciao"
                  minLength: 1
                  maxLength: 1000
                replyTo:
                  $ref: '#/components/schemas/GeneralId'
                  description: ID of the message being replied to (optional)
      responses:
        "201":
          description: Message sent successfully and returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                id: "avfd457ud3"
                sender: "avfd457ud3"
                chatId: "avfd457ud3"
                text: "ciao"
                instant: "2026-09-08T22:00:00Z"
                state: 1
                forwarded: false
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: []
          
          
  /chats/{chatId}/messages/{messageId}:
    parameters:
      - $ref: '#/components/parameters/chatIdParam'
      - $ref: '#/components/parameters/messageIdParam'

    delete:
      tags: ["message"]
      operationId: deleteMessage
      summary: Delete a message
      description: |
        Delete a specific chat message by id
      responses:
        "204":
          description: Message deleted successfully
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: []
      
      
  /chats/{chatId}/messages/{messageId}/forward:
    parameters:
      - $ref: '#/components/parameters/chatIdParam'
      - $ref: '#/components/parameters/messageIdParam'

    post:
      tags: ["message"]
      operationId: forwardMessage
      summary: Forward a message
      description: |
        Receiving a message from a chat, forward the message specifying the chat ID
      requestBody:
        description: Recipient of the forwarded message
        required: true
        content:
          application/json:
            schema:
              description: Forward message request body
              type: object
              properties:
                chatId:
                  $ref: '#/components/schemas/GeneralId'
              required:
                - chatId
      responses:
        "201":
          description: Message forwarded successfully and returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                id: "avfd457ud3"
                sender: "avfd457ud3"
                chatId: "avfd457ud3"
                text: "ciao"
                instant: "2026-09-08T22:00:00Z"
                state: 1
                forwarded: true
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: []
                
                
  /chats/{chatId}/messages/{messageId}/comments:
    parameters:
      - $ref: '#/components/parameters/chatIdParam'
      - $ref: '#/components/parameters/messageIdParam'

    post:
      tags: ["comment"]
      operationId: commentMessage
      summary: Comment a message
      description: |
        reacts to a message with emojis
      requestBody:
        description: Emoji to react with
        required: true
        content: 
          application/json:
            schema:
              description: Comment to send
              type: object
              properties:
                sender:
                  $ref: '#/components/schemas/GeneralId'
                emoji:
                  type: string
                  description: Emoji used to react to the message
                  example: "👍"
                  pattern: '^[^\\s]{1,10}$'
                  minLength: 1
                  maxLength: 10
      responses:
        "201": 
          description: Reaction sent successfully and returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
              example:
                id: "avfd457ud3"
                sender: "avfd457ud3"
                emoji: "👍"
                messageId: "avfd457ud3"
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: []
        
                
                
  /chats/{chatId}/messages/{messageId}/comments/{commentId}:
    parameters:
      - $ref: '#/components/parameters/chatIdParam'
      - $ref: '#/components/parameters/messageIdParam'
      - $ref: '#/components/parameters/commentIdParam'

    delete:
      tags: ["comment"]
      operationId: uncommentMessage
      summary: Delete a reaction
      description: |
        Delete a specific reaction by id
      responses:
        "204":
          description: Reaction successfully deleted
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: []
  
  /chats/{chatId}/name:
    parameters:
      - $ref: '#/components/parameters/chatIdParam'
    patch:
      tags: ["group"]
      operationId: setGroupName
      summary: Update the group name
      description: |
        Update the name of a specific group
      requestBody:
        description: New group name
        required: true
        content:
          application/json:
            schema:
              description: Update group name request body
              type: object
              properties:
                name:
                  description: New group name
                  type: string
                  minLength: 3
                  maxLength: 25
                  pattern: '^(?=.*\S).+$'
                  example: "New group name"
      responses:
        "200":
          description: Group name updated
          content:
            application/json:
              schema:
                description: Updated group name response body
                type: object
                properties:
                  name:
                    description: New group name
                    type: string
                    minLength: 3
                    maxLength: 25
                    pattern: '^(?=.*\S).+$'
                    example: "New group name"
              example:
                name: "New group name"
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: []
                
          
  /chats/{chatId}/photo:
    parameters:
      - $ref: '#/components/parameters/chatIdParam'
    put:
      tags: ["group"]
      operationId: setGroupPhoto
      summary: Update group photo
      description: |
        Update the group profile photo
      requestBody:
        description: New photo
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Photo'
      responses:
        "200":
          description: Photo updated successfully
          content:
