openapi: 3.0.0
info:
  title: WASAText
  description: |
    Messaging platform that supports individual and group chats, accessible via PC.
  version: 1.0.0

components:
  schemas:
    User:
      description: User object
      type: object
      properties:
        user_id: 
          $ref: '#/components/schemas/General_id'
        name:
          type: string
          example: "Luca"
        photo:
          $ref: '#/components/schemas/Photo'
      required:
      - user_id
    
    Photo:
      description: User or group profile photo
      type: object
      properties:
        photo:
          type: string
          format: uri
          example: "Desktop/me/foto.png"
          
    General_id:
      description: Defines the format for identifiers
      type: string
      example: "avfd457ud3"
      minLength: 3
      maxLength: 16
      pattern: '^.*?$'
          
    Object_id:
      description: Response object with identifier
      type: object
      properties:
        user_id:
          $ref: '#/components/schemas/General_id'
          
    Chat_list:
      description: Chat list in reverse chronological order
      type: array
      items:
        $ref: '#/components/schemas/Chat_preview'
        
    Chat_preview:
      description: |
        Chat preview object showing name, photo, last message and its sending time
      type: object
      properties:
        id:
          $ref: '#/components/schemas/General_id'
        name:
          type: string
          example: "Luca"
        photo:
          $ref: '#/components/schemas/Photo'
        last_message_instant:
          type: string
          format: date-time
        last_message:
          $ref: '#/components/schemas/Message'
        
    Message:
      description: | 
        Message object
      type: object
      properties: 
        id:
          $ref: '#/components/schemas/General_id'
        sender:
          $ref: '#/components/schemas/User'
        text:
          type: string
          example: "ciao"
        instant:
          type: string
          example: date-time
        state:
          type: integer
          enum: 
            - 1
            - 2
      required:
       - text
    
    Messages:
      description: Lista di messaggi in ordine cronologico inverso
      type: array
      items:
        $ref: '#/components/schemas/Message'
        
    Chat:
      description: |
        Oggetto di chat generica (chat singola o gruppo)
      type: object
      properties:
        identificativo: 
          $ref: '#/components/schemas/General_id'
        messaggi:
          $ref: '#/components/schemas/Messages'
        
        
    Single_chat:
      description: |
        Oggetto che definisce la chat tra due persone
      allOf:
      - $ref: '#/components/schemas/Chat'
      - type: object
        properties:
          destinatario:
            $ref: '#/components/schemas/User'

    
    Group:
      description: |
        Oggetto che definisce un gruppo, comprende id, nome, lista dei partecipanti
        e foto del gruppo (facoltativa)
      allOf:
      - $ref: '#/components/schemas/Chat'
      - type: object
        properties:
          nome:
            type: string
            example: "Gruppo vacanze"
          partecipanti:
            type: array
            items:
              $ref: '#/components/schemas/User'
          foto:
            $ref: '#/components/schemas/Photo'
        required:
          - identificativo
          - nome
  
  
    Error:
      description: |
        Oggetto di risposta per codici di errore
      type: object
      properties:
        codice:
          type: string
          example: "Bad Request"
        messaggio:
          type: string
          example: "Manca l'oggetto da sostituire"
          
    
  
  
  parameters:
    user_id_param:
      name: user_id
      in: path
      description: Identificatore utente
      required: true
      schema: 
        $ref: '#/components/schemas/General_id'
        
    message_id_param:
      name: message_id
      in: path
      description: Identificatore messaggio
      required: true
      schema:
        $ref: '#/components/schemas/General_id'
    
    comment_id_param:
      name: comment_id
      in: path
      description: Identificatore risposta
      required: true
      schema:
        $ref: '#/components/schemas/General_id'
        
    group_id_param:
      name: group_id
      in: path
      description: Identificatore gruppo
      required: true
      schema:
        $ref: '#/components/schemas/General_id'
    
    chat_id_param:
      name: chat_id
      in: path
      description: Identificatore chat
      required: true
      schema: 
        $ref: '#/components/schemas/General_id'
        
        
  responses:
    BadRequest:
      description: Richiesta non fornita o errata
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
            
    NotFound:
      description: Risorsa non trovata
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      



paths:
  /session:
    post:
      tags: ["login"]
      operationId: doLogin
      summary: Logs in the user
      description: |
        If the user does not exist, it will be created,
        and an identifier is returned.
        If the user exists, the user identifier is returned
      requestBody:
        description: User details
        required: true
        content:
          application/json:
            schema:
                type: object
                properties:
                  name:
                    type: string
                    example: Maria
                    pattern: '^.*?$'
                    minLength: 3
                    maxLength: 16
      responses:
        "201":
          description: User log-in action succesful
          content:
            application/json:
              schema:
                type: object
                properties:
                  identifier:
                    type: string
                    example: "abcdef012345"
                
                
  /me/username: 
    put:
      operationId: setMyUsername
      summary: Update the user's nickname
      description: |
        Update the user's nickname and returns it
      requestBody:
        description: |
          Object with the new nickname to be replaced with the old one
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Object_id'
      responses:
        "200":
          description: Update successful and nickname returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Object_id'
        "400":
          $ref: '#/components/responses/BadRequest'
             
                
  /me/photo:
    put:
      operationId: setMyPhoto
      summary: Update the user's photo
      description: |
        Update the user's photo and returns it
      requestBody:
        description: New photo to be replaced with the old one 
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Photo'
      responses:
        "200":
          description: Photo updated successfully
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/User'
        "400":
          $ref: '#/components/responses/BadRequest'
              
                    
  /me/chats:
    get:
      operationId: getMyConversations
      summary: List all chats
      description: |
        Lists all the user's chats in reverse chronological order
      responses:
        "200":
          description: Chat list returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat_list'
        "404":
          $ref: '#/components/responses/NotFound'
  
                
  /me/chats/{chat_id}/messages:
    parameters:
      - $ref: '#/components/parameters/chat_id_param'
    get:
      operationId: getConversation
      summary:  Returns a chat
      description: |
        Returns the chat of a group or with a specific user
      responses:
        "200":
          description: Chat returned successfully
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/Chat'
        "404":
          $ref: '#/components/responses/NotFound'
          
    post:
      operationId: sendMessage
      summary: Send a message
      description: |
        Send a message in chat
      requestBody:
        description: Messagge to send
        required: true
        content: 
          application/json:
            schema:
              $ref: '#/components/schemas/Message'
      responses:
        "201":
          description: Messagge sent successfully and returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
          
          
  /me/chats/{chat_id}/messages/{message_id}:
    parameters:
      - $ref: '#/components/parameters/chat_id_param'
      - $ref: '#/components/parameters/message_id_param'
      
    delete:
      operationId: deleteMessage
      summary: Delete a message
      description: |
        delete a specific chat message by id
      responses:
        "204":
          description: Message successfully deleted
        "404":
          $ref: '#/components/responses/NotFound'
      
          
  /me/chats/{chat_id}/messages/{message_id}/forward:
    parameters:
      - $ref: '#/components/parameters/chat_id_param'
      - $ref: '#/components/parameters/message_id_param'
    
    post:
      operationId: forwardMessage
      summary: Forward a message
      description: |
        Receiving a message from a chat, forward the message specifying the chat ID
      requestBody:
        description: Recipient of the forwarded message
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        "201":
          description: Message forwarded successfully and returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
                
                
  /me/chats/{chat_id}/messages/{message_id}/comment:
    parameters:
      - $ref: '#/components/parameters/chat_id_param'
      - $ref: '#/components/parameters/message_id_param'
    
    post:
      operationId: commentMessage
      summary: Commento messaggio
      description: |
        Preso un messaggio da una chat, risponde al messaggio commentando con 
        un ulteriore messaggio sulla stessa chat
      requestBody:
        description: Messaggio con cui rispondere
        required: true
        content: 
          application/json:
            schema:
              $ref: '#/components/schemas/Message'
      responses:
        "200": 
          description: Risposta inviata con successo
        
                
                
  /me/chats/{chat_id}/messages/{message_id}/comment/{comment_id}:
    parameters:
      - $ref: '#/components/parameters/chat_id_param'
      - $ref: '#/components/parameters/message_id_param'
      - $ref: '#/components/parameters/comment_id_param'
      
    delete:
      operationId: uncommentMessage
      summary: Eliminazione commento
      description: |
        Elimina tramite id lo specifico commento di uno 
        specifico messaggio
      responses:
        "204":
          description: Commento eliminato con successo
          
          
  /me/chats/groups:
    post:
      operationId: createGroup
      summary: Crea gruppo
      description: |
        Crea gruppo assegnando id, nome e foto profilo (facoltativa)
      requestBody:
        description: Nome e foto del gruppo
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Group'
      responses:
        "201":
          description: Gruppo creato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
                
