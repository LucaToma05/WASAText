openapi: 3.0.0
info:
  title: WASAText
  description: |
    Piattaforma di messaggistica che supporta chat individuali e di gruppo, accessibile tramite PC.
  version: 1.0.0

components:
  schemas:
    User_id:
      description: Identificatore utente
      type: string
      example: "avfd457ud3"
          
    Object_id:
      description: Risposta con identificatore a seguito del login
      type: object
      properties:
        user_id:
          $ref: '#/components/schemas/User_id'
          
    Chat_list:
      description: Lista di chat in ordine cronologico inverso
      type: array
      items:
        $ref: '#/components/schemas/Message'
        
    Message:
      description: | 
        Oggetto messaggio utilizzato anche come preview di chat con un altro utente
      type: object
      properties: 
        identificativo:
          type: string
          example: "vadbjk31po"
        proprietario:
          type: string
          example: "Simone"
        ultimo_messaggio:
          type: string
          example: "ciao"
        istante_ultimo_messaggio:
          type: string
          example: date-time
        foto_profilo:
          type: string
          format: binary
    
    Chat:
      description: Lista di messaggi in ordine cronologico inverso
      type: array
      items:
        $ref: '#/components/schemas/Message'
            
    
  
  
  parameters:
    user_id_param:
      name: user_id
      in: path
      description: Identificatore utente
      required: true
      schema: 
        $ref: '#/components/schemas/User_id'
          

paths:
  /session:
    post:
      operationId: doLogin
      summary: Creazione utente
      description: |
        Se l'utente non esiste, viene creato. Viene ritornato l'identificatore in entrambi i casi.
      requestBody:
        description: |
          Username dell'utente.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Object_id'
      responses:
        "201":
          description: Utente creato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Object_id'
                
  /users/{user_id}: 
    parameters:
      - $ref: '#/components/parameters/user_id_param'
      
    put:
      operationId: setMyUsername
      summary: Aggiornamento del nickname dell'utente
      description: |
        Sostituisce il nickname dell'utente
      requestBody:
        description: |
          Oggetto con nickanem da sostituire con il precedente
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Object_id'
      responses:
        "200":
          description: Aggiornamento avvenuto con successo e oggetto restituito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Object_id'
      
      
      
                    
  /users/{user_id}/chats:
    parameters:
      - $ref: '#/components/parameters/user_id_param'
      
    get:
      operationId: getMyConversations
      summary: Elenca chat
      description: |
        Elenca tutte le chat dell'utente in ordine cronologico inverso
      responses:
        "200":
          description: Elenco delle chat restituito con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat_list'
  
                
  /users/{user_id}/chats/{user_id}/messages:
    parameters:
      - $ref: '#/components/parameters/user_id_param'
    get:
      operationId: getConversation
      summary:  Restituisce una chat
      description: |
        Restituisce la chat con uno specifico utente/gruppo
      responses:
        "200":
          description: Chat restituita con successo
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/Chat'
                
    post:
      operationId: sendMessage
      summary: Invio messaggio
      description: |
        Invio di un messaggio in una chat
      requestBody:
        description: Messaggio da inviare
        required: true
        content: 
          application/json:
            schema:
              $ref: '#/components/schemas/Message'
      responses:
        "200":
          description: Messaggio inviato con successo
          
        