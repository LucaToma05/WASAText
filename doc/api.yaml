openapi: 3.0.0
info:
  title: WASAText
  description: |
    Piattaforma di messaggistica che supporta chat individuali e di gruppo, accessibile tramite PC.
  version: 1.0.0

components:
  schemas:
    User:
      description: Oggetto utente
      type: object
      properties:
        user_id: 
          $ref: '#/components/schemas/General_id'
        nome:
          type: string
          example: "Luca"
        foto_profilo:
          $ref: '#/components/schemas/Photo'
    
    Photo:
      description: Foto profilo dell'utente
      type: object
      properties:
        photo:
          type: string
          format: uri
          example: "Desktop/me/foto.png"
          
    General_id:
      description: Definisce il formato di identificatori generale
      type: string
      example: "avfd457ud3"
          
    Object_id:
      description: Risposta con identificatore a seguito del login
      type: object
      properties:
        user_id:
          $ref: '#/components/schemas/General_id'
          
    Chat_list:
      description: Lista di chat in ordine cronologico inverso
      type: array
      items:
        $ref: '#/components/schemas/Chat_preview'
        
    Chat_preview:
      description: |
        Oggetto preview di una chat che mostra nome, foto, ultimo messaggio e la sua relativa ora di invio
      type: object
      properties:
        identificativo:
          $ref: '#/components/schemas/General_id'
        nome:
          type: string
          example: "Luca"
        foto_profilo:
          $ref: '#/components/schemas/Photo'
        istante_ultimo_messaggio:
          type: string
          format: date-time
        ultimo_messaggio:
          $ref: '#/components/schemas/Message'
        
    Message:
      description: | 
        Oggetto messaggio 
      type: object
      properties: 
        identificativo:
          $ref: '#/components/schemas/General_id'
        mittente:
          $ref: '#/components/schemas/User'
        testo:
          type: string
          example: "ciao"
        istante:
          type: string
          example: date-time
        state:
          type: integer
          enum: 
            - 1
            - 2
    
    Chat:
      description: Lista di messaggi in ordine cronologico inverso
      type: array
      items:
        $ref: '#/components/schemas/Message'
        
    Single_chat:
      description: |
        Oggetto che definisce la chat tra due persone
      type: object
      properties:
        identificativo:
          $ref: '#/components/schemas/General_id'
        destinatario:
          $ref: '#/components/schemas/User'
        messaggi:
          $ref: '#/components/schemas/Chat'
    
    Group:
      description: |
        Oggetto che definisce un gruppo, comprende id, nome, lista dei partecipanti
        e foto del gruppo (facoltativa)
      type: object
      properties:
        identificativo:
          $ref: '#/components/schemas/General_id'
        nome:
          type: string
          example: "Gruppo vacanze"
        partecipanti:
          type: array
          items:
            $ref: '#/components/schemas/User'
        foto:
          $ref: '#/components/schemas/Photo'
        messaggi:
          $ref: '#/components/schemas/Chat'
      required:
        - identificativo
        - nome
  
  
  
  parameters:
    user_id_param:
      name: user_id
      in: path
      description: Identificatore utente
      required: true
      schema: 
        $ref: '#/components/schemas/General_id'
        
    message_id_param:
      name: message_id
      in: path
      description: Identificatore messaggio
      required: true
      schema:
        $ref: '#/components/schemas/General_id'
    
    comment_id_param:
      name: comment_id
      in: path
      description: Identificatore risposta
      required: true
      schema:
        $ref: '#/components/schemas/General_id'
        
    group_id_param:
      name: group_id
      in: path
      description: Identificatore gruppo
      required: true
      schema:
        $ref: '#/components/schemas/General_id'
    
    chat_id_param:
      name: chat_id
      in: path
      description: Identificatore chat
      required: true
      schema: 
        $ref: '#/components/schemas/General_id'



paths:
  /session:
    post:
      operationId: doLogin
      summary: Creazione utente
      description: |
        Se l'utente non esiste, viene creato. Viene ritornato l'identificatore in entrambi i casi.
      requestBody:
        description: |
          Username dell'utente.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Object_id'
      responses:
        "201":
          description: Utente creato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Object_id'
                
  /users/{user_id}/username: 
    parameters:
      - $ref: '#/components/parameters/user_id_param'
      
    put:
      operationId: setMyUsername
      summary: Aggiornamento del nickname dell'utente
      description: |
        Sostituisce il nickname dell'utente
      requestBody:
        description: |
          Oggetto con nickanem da sostituire con il precedente
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Object_id'
      responses:
        "200":
          description: Aggiornamento avvenuto con successo e oggetto restituito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Object_id'
                
                
  /users/{user_id}/photo:
    parameters:
      - $ref: '#/components/parameters/user_id_param'
    
    put:
      operationId: setMyPhoto
      summary: Aggiorna foto
      description: |
        Aggiorna la foto profilo dell'utente
      requestBody:
        description: Foto da aggiornare
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Photo'
      responses:
        "201":
          description: Foto profilo aggiornata con successo
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/User'
              
              
                    
  /users/{user_id}/chats:
    parameters:
      - $ref: '#/components/parameters/user_id_param'
      
    get:
      operationId: getMyConversations
      summary: Elenca chat
      description: |
        Elenca tutte le chat dell'utente in ordine cronologico inverso
      responses:
        "200":
          description: Elenco delle chat restituito con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat_list'
  
                
  /users/{user_id}/chats/{chat_id}/messages:
    parameters:
      - $ref: '#/components/parameters/user_id_param'
      - $ref: '#/components/parameters/chat_id_param'
    get:
      operationId: getConversation
      summary:  Restituisce una chat
      description: |
        Restituisce la chat con uno specifico utente/gruppo
      responses:
        "200":
          description: Chat restituita con successo
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/Chat'
                
    post:
      operationId: sendMessage
      summary: Invio messaggio
      description: |
        Invio di un messaggio in una chat
      requestBody:
        description: Messaggio da inviare
        required: true
        content: 
          application/json:
            schema:
              $ref: '#/components/schemas/Message'
      responses:
        "200":
          description: Messaggio inviato con successo
          
  /users/{user_id}/chats/{chat_id}/messages/{message_id}:
    parameters:
      - $ref: '#/components/parameters/user_id_param'
      - $ref: '#/components/parameters/chat_id_param'
      - $ref: '#/components/parameters/message_id_param'
      
    delete:
      operationId: deleteMessage
      summary: Eliminazione messaggio
      description: |
        Elimina tramite id un specifico messaggio in una chat
      responses:
        "204":
          description: Commento eliminato con successo
      
          
  /users/{user_id}/chats/{chat_id}/messages/{message_id}/forward:
    parameters:
      - $ref: '#/components/parameters/user_id_param'
      - $ref: '#/components/parameters/chat_id_param'
      - $ref: '#/components/parameters/message_id_param'
    
    post:
      operationId: forwardMessage
      summary: Inoltro messaggio
      description: |
        Preso un messaggio da una chat, inoltra il messaggio specificando l'identificativo della chat
      requestBody:
        description: Destinatario del messaggio da inoltrare
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                forwarding_user_id:
                  type: string
      responses:
        "200":
          description: Messaggio inoltrato con successo
                
  /users/{user_id}/chats/{chat_id}/messages/{message_id}/comment:
    parameters:
      - $ref: '#/components/parameters/user_id_param'
      - $ref: '#/components/parameters/chat_id_param'
      - $ref: '#/components/parameters/message_id_param'
    
    post:
      operationId: commentMessage
      summary: Commento messaggio
      description: |
        Preso un messaggio da una chat, risponde al messaggio commentando con 
        un ulteriore messaggio sulla stessa chat
      requestBody:
        description: Messaggio con cui rispondere
        required: true
        content: 
          application/json:
            schema:
              $ref: '#/components/schemas/Message'
      responses:
        "200": 
          description: Risposta inviata con successo
        
                
                
  /users/{user_id}/chats/{chat_id}/messages/{message_id}/comment/{comment_id}:
    parameters:
      - $ref: '#/components/parameters/user_id_param'
      - $ref: '#/components/parameters/chat_id_param'
      - $ref: '#/components/parameters/message_id_param'
      - $ref: '#/components/parameters/comment_id_param'
      
    delete:
      operationId: uncommentMessage
      summary: Eliminazione commento
      description: |
        Elimina tramite id lo specifico commento di uno 
        specifico messaggio
      responses:
        "204":
          description: Commento eliminato con successo
          
          
  /users/{user_id}/chats/groups:
    parameters:
      - $ref: '#/components/parameters/user_id_param'
      
    post:
      operationId: createGroup
      summary: Crea gruppo
      description: |
        Crea gruppo assegnando id, nome e foto profilo (facoltativa)
      requestBody:
        description: Nome e foto del gruppo
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Group'
      responses:
        "201":
          description: Gruppo creato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
                
                

          
  
  /users/{user_id}/chats/groups/{group_id}/name:
    parameters:
      - $ref: '#/components/parameters/user_id_param'
      - $ref: '#/components/parameters/group_id_param'
    put:
      operationId: setGroupName
      summary: Aggiorna nome gruppo
      description: |
        Aggiorna il nome di un determinato gruppo
      requestBody:
        description: Nome da assegnare al gruppo
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nome:
                  type: string
                  example: "gruppo università"
      responses:
        "200":
          description: Nome del gruppo aggiornato
          
          
  /users/{user_id}/chats/groups/{group_id}/photo:
    parameters:
      - $ref: '#/components/parameters/user_id_param'
      - $ref: '#/components/parameters/group_id_param'
  
    put:
      operationId: setGroupPhoto
      summary: Aggiorna foto del gruppo
      description: |
        Aggiorna la foto profilo del gruppo
      requestBody:
        description: Foto da aggiornare
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Photo'
      responses:
        "200":
          description: Foto profilo aggiornata con successo
      
  
          
  /users/{user_id}/chats/groups/{group_id}/members:
    parameters:
      - $ref: '#/components/parameters/user_id_param'
      - $ref: '#/components/parameters/group_id_param'

    post:
      operationId: addToGroup
      summary: Aggiungi al gruppo
      description: |
        Inserisce un utente in un gruppo
      requestBody:
        description: Utente da inserire nel gruppo
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/General_id'
      responses:
        "200":
          description: Utente aggiunto al gruppo con successo
  
    delete:
      operationId: leaveGroup
      summary: Abbandona gruppo
      description: |
        L'utente corrente abbandona il gruppo
      responses:
        "204":  
          description: L'utente ha abbandonato il gruppo correttamente
        
