openapi: 3.0.0
info:
  title: WASAText
  description: |
    Messaging platform that supports individual and group chats, accessible via PC.
  version: 1.0.0

components:
  schemas:
    User:
      description: User object
      type: object
      properties:
        user_id: 
          $ref: '#/components/schemas/General_id'
        name:
          type: string
          description: User nickname
          example: "Luca"
          pattern: '^.*?$'
          minLength: 3
          maxLength: 25
        photo:
          $ref: '#/components/schemas/Photo'
      required:
      - user_id
    
    Photo:
      description: User or group profile photo
      type: object
      properties:
        url:
          type: string
          description: URL of the photo
          format: url
          pattern: '^.*?$'
          minLength: 1
          maxLength: 1000
          example: "https://foto.com/foto.png"
          
    General_id:
      description: Defines the format for identifiers
      type: string
      example: "avfd457ud3"
      minLength: 3
      maxLength: 16
      pattern: '^.*?$'
          
    Chat_list:
      description: Chat list in reverse chronological order
      type: object
      properties:
        chats:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/Chat_preview'
        
    Chat_preview:
      description: |
        Chat preview object showing name, photo, last message and its sending time
      type: object
      properties:
        id:
          $ref: '#/components/schemas/General_id'
        name:
          type: string
          description: Chat name (user nickname or group name)
          pattern: '^.*?$'
          minLength: 3
          maxLength: 25
          example: "Luca"
        photo:
          $ref: '#/components/schemas/Photo'
        last_message:
          $ref: '#/components/schemas/Message'
        
    Message:
      description: Message object
      type: object
      properties: 
        id:
          $ref: '#/components/schemas/General_id'
        sender:
          $ref: '#/components/schemas/User'
        text:
          type: string
          description: Message content
          pattern: '^.*?$'
          example: "ciao"
          minLength: 1
          maxLength: 1000
        instant:
          type: string
          minLength: 1
          maxLength: 100
          description: Message sending time
          format: date-time
        comments:
          type: array
          description: List of reactions to the message
          minItems: 0
          maxItems: 100
          items:
            $ref: '#/components/schemas/Comment'
        state:
          type: integer
          description: Message state (1 = received, 2 = read)
          enum: 
            - 1
            - 2
      required:
        - text
       
    
    Comment:
      description: Reaction object
      type: object
      properties:
        id: 
          $ref: '#/components/schemas/General_id'
        sender:
          $ref: '#/components/schemas/User'
        emoji:
          type: string
          description: Emoji used to react to the message
          enum:
          - 👍
          - 😂
          - ❤️
          - 😡
      required: 
        - emoji
    
    Messages:
      description: List of messages in reverse chronological order
      type: array
      minItems: 0
      items:
        $ref: '#/components/schemas/Message'
        
    Chat:
      description: Generic chat object (single or group chat)
      type: object
      properties:
        id: 
          $ref: '#/components/schemas/General_id'
        messages:
          $ref: '#/components/schemas/Messages'


    Group:
      description: Object that defines a group including id, name, list of participants and group photo (optional)
      allOf:
      - $ref: '#/components/schemas/Chat'
      - type: object
        properties:
          name:
            description: Group name
            type: string
            pattern: '^.*?$'
            example: "Class group"
            minLength: 3
            maxLength: 25
          participants:
            description: List of users in the group
            type: array
            minItems: 1
            maxItems: 100
            items:
              $ref: '#/components/schemas/User'
          photo:
            $ref: '#/components/schemas/Photo'
        required:
          - name
  
  
    Error:
      description: Response subject for error codes
      type: object
      properties:
        code:
          description: Error code
          type: string
          pattern: '^.*?$'
          example: "Bad Request"
          minLength: 3
          maxLength: 50
        message:
          description: Error message
          type: string
          pattern: '^.*?$'
          example: "Missing request"
          minLength: 3
          maxLength: 100
          
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
          
  parameters:
    user_id_param:
      name: user_id
      in: path
      description: User identifier
      required: true
      schema: 
        $ref: '#/components/schemas/General_id'
        
    message_id_param:
      name: message_id
      in: path
      description: Message identifier
      required: true
      schema:
        $ref: '#/components/schemas/General_id'
    
    comment_id_param:
      name: comment_id
      in: path
      description: Reaction identifier
      required: true
      schema:
        $ref: '#/components/schemas/General_id'
    
    chat_id_param:
      name: chat_id
      in: path
      description: Chat identifier
      required: true
      schema: 
        $ref: '#/components/schemas/General_id'
        
        
  responses:
    BadRequest:
      description: Missing request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
            
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
            
    UnauthorizedError:
      description: Access token is missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      
security:
  - bearerAuth: []


paths:
  /session:
    post:
      tags: ["login"]
      operationId: doLogin
      summary: Logs in the user
      description: |
        If the user does not exist, it will be created,
        and an identifier is returned.
        If the user exists, the user identifier is returned
      requestBody:
        description: User details
        required: true
        content:
          application/json:
            schema:
                type: object
                properties:
                  name:
                    description: User nickname
                    type: string
                    example: Maria
                    pattern: '^.*?$'
                    minLength: 3
                    maxLength: 16
      responses:
        "201":
          description: User log-in action succesful
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    $ref: '#/components/schemas/General_id'
        "400":
          $ref: '#/components/responses/BadRequest'
        "500":
          $ref: '#/components/responses/InternalServerError'
                
  /me/username: 
    patch:
      tags: ["user"]
      operationId: setMyUserName
      summary: Update the user's nickname
      description: |
        Update the user's nickname and returns it
      requestBody:
        description: |
          New nickname to be replaced with the old one
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  description: New nickname
                  type: string
                  minLength: 3
                  maxLength: 25
                  pattern: '^.*?$'
                  example: "New username"
      responses:
        "200":
          description: Update successful and nickname returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  username:
                    description: Updated nickname
                    type: string
                    minLength: 3
                    maxLength: 25
                    pattern: '^.*?$'
                    example: "New username"
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "500":
          $ref: '#/components/responses/InternalServerError'
      
      security:
        - bearerAuth: []
             
                
  /me/photo:
    put:
      tags: ["user"]
      operationId: setMyPhoto
      summary: Update the user's photo
      description: |
        Update the user's photo and returns it
      requestBody:
        description: New photo to be replaced with the old one 
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Photo'
      responses:
        "200":
          description: Photo updated successfully
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/Photo'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "500":
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: []
              
                    
  /chats:
    get:
      tags: ["chat"]
      operationId: getMyConversations
      summary: List all chats
      description: |
        Lists all the user's chats in reverse chronological order
      responses:
        "200":
          description: Chat list returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat_list'
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "500":
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: []

    post:
      tags: ["chat"]
      operationId: createChat
      summary: Create a chat
      description: |
        Create a chat with a specific user or group
      requestBody:
        description: User or group to create a chat with
        required: true
        content:
          application/json:
            schema:
              description: User or group type of conversation
              type: object
              properties:
                type:
                  description: Type of conversation to create
                  type: string 
                  enum: ["user", "group"]
                  example: "user"
                participants:
                  description: User or group to create a chat with
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    $ref: '#/components/schemas/General_id'
      responses:
        "201":
          description: Chat created successfully and returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "500":
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: []
  
                
  /chats/{chat_id}/messages:
    parameters:
      - $ref: '#/components/parameters/chat_id_param'
    get:
      tags: ["message"]
      operationId: getConversation
      summary:  Returns the messages of a chat
      description: |
        Returns the messages of a group or a chat with a specific user
      responses:
        "200":
          description: Messages returned successfully
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/Messages'
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: []
     
    post:
      tags: ["message"]
      operationId: sendMessage
      summary: Send a message
      description: |
        Send a message in chat
      requestBody:
        description: Message to send
        required: true
        content: 
          application/json:
            schema:
              description: Message object to send
              type: object
              properties:
                text:
                  description: Message content
                  type: string
                  pattern: '^.*?$'
                  example: "ciao"
                  minLength: 1
                  maxLength: 1000
      responses:
        "201":
          description: Message sent successfully and returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "404":
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: []
          
          
  /chats/{chat_id}/messages/{message_id}:
    parameters:
      - $ref: '#/components/parameters/chat_id_param'
      - $ref: '#/components/parameters/message_id_param'
      
    delete:
      tags: ["message"]
      operationId: deleteMessage
      summary: Delete a message
      description: |
        Delete a specific chat message by id
      responses:
        "204":
          description: Message successfully deleted
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "404":
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: []
      
      
  /chats/{chat_id}/messages/{message_id}/forward:
    parameters:
      - $ref: '#/components/parameters/chat_id_param'
      - $ref: '#/components/parameters/message_id_param'
    
    post:
      tags: ["message"]
      operationId: forwardMessage
      summary: Forward a message
      description: |
        Receiving a message from a chat, forward the message specifying the chat ID
      requestBody:
        description: Recipient of the forwarded message
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  $ref: '#/components/schemas/General_id'
              required:
                - user_id
      responses:
        "201":
          description: Message forwarded successfully and returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "404":
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: []
                
                
  /chats/{chat_id}/messages/{message_id}/comments:
    parameters:
      - $ref: '#/components/parameters/chat_id_param'
      - $ref: '#/components/parameters/message_id_param'
    
    post:
      tags: ["comment"]
      operationId: commentMessage
      summary: Comment a message
      description: |
        reacts to a message with emojis
      requestBody:
        description: Emoji to react with
        required: true
        content: 
          application/json:
            schema:
              $ref: '#/components/schemas/Comment'
      responses:
        "201": 
          description: Reaction sent successfully and returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "404":
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: []
        
                
                
  /chats/{chat_id}/messages/{message_id}/comments/{comment_id}:
    parameters:
      - $ref: '#/components/parameters/chat_id_param'
      - $ref: '#/components/parameters/message_id_param'
      - $ref: '#/components/parameters/comment_id_param'
      
    delete:
      tags: ["comment"]
      operationId: uncommentMessage
      summary: Delete a reaction
      description: |
        Delete a specific reaction by id
      responses:
        "204":
          description: Reaction successfully deleted
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "404":
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: []
  
  /chats/{chat_id}/name:
    parameters:
      - $ref: '#/components/parameters/chat_id_param'
    patch:
      tags: ["group"]
      operationId: setGroupName
      summary: Update the group name
      description: |
        Update the name of a specific group
      requestBody:
        description: New group name
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  description: New group name
                  type: string
                  minLength: 3
                  maxLength: 25
                  pattern: '^.*?$'
                  example: "New group name"
      responses:
        "200":
          description: Group name updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "404":
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: []
                
          
  /chats/{chat_id}/photo:
    parameters:
      - $ref: '#/components/parameters/chat_id_param'
    put:
      tags: ["group"]
      operationId: setGroupPhoto
      summary: Update group photo
      description: |
        Update the group profile photo
      requestBody:
        description: New photo
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Photo'
      responses:
        "200":
          description: Photo updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Photo'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "404":
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: []

          
  /chats/{chat_id}/members:
    parameters:
      - $ref: '#/components/parameters/chat_id_param'
    post:
      tags: ["group"]
      operationId: addToGroup
      summary: Add user to a group
      description: |
        Add user to a group
      requestBody:
        description: User to put in the group
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        "201":
          description: User added to group successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "404":
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: []
  
    delete:
      tags: ["group"]
      operationId: leaveGroup
      summary: Leave the group
      description: |
        The current user leaves the group
      responses:
        "204":  
          description: The user has successfully left the group
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "404":
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: []
        
