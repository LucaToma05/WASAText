openapi: 3.0.0
info:
  title: WASAText
  description: |
    Piattaforma di messaggistica che supporta chat individuali e di gruppo, accessibile tramite PC.
  version: 1.0.0

components:
  schemas:
    User:
      description: Oggetto utente
      type: object
      properties:
        user_id: 
          $ref: '#/components/schemas/General_id'
        nome:
          type: string
          example: "Luca"
        foto_profilo:
          $ref: '#/components/schemas/Photo'
    
    Photo:
      description: Foto profilo dell'utente
      type: object
      properties:
        photo:
          type: string
          format: uri
          example: "Desktop/me/foto.png"
          
    General_id:
      description: Definisce il formato di identificatori generale
      type: string
      example: "avfd457ud3"
      minLength: 3
      maxLength: 16
          
    Object_id:
      description: Risposta con identificatore a seguito del login
      type: object
      properties:
        user_id:
          $ref: '#/components/schemas/General_id'
          
    Chat_list:
      description: Lista di chat in ordine cronologico inverso
      type: array
      items:
        $ref: '#/components/schemas/Chat_preview'
        
    Chat_preview:
      description: |
        Oggetto preview di una chat che mostra nome, foto, ultimo messaggio e la sua relativa ora di invio
      type: object
      properties:
        identificativo:
          $ref: '#/components/schemas/General_id'
        nome:
          type: string
          example: "Luca"
        foto_profilo:
          $ref: '#/components/schemas/Photo'
        istante_ultimo_messaggio:
          type: string
          format: date-time
        ultimo_messaggio:
          $ref: '#/components/schemas/Message'
        
    Message:
      description: | 
        Oggetto messaggio 
      type: object
      properties: 
        identificativo:
          $ref: '#/components/schemas/General_id'
        mittente:
          $ref: '#/components/schemas/User'
        testo:
          type: string
          example: "ciao"
        istante:
          type: string
          example: date-time
        state:
          type: integer
          enum: 
            - 1
            - 2
    
    Messages:
      description: Lista di messaggi in ordine cronologico inverso
      type: array
      items:
        $ref: '#/components/schemas/Message'
        
    Chat:
      description: |
        Oggetto di chat generica (chat singola o gruppo)
      type: object
      properties:
        identificativo: 
          $ref: '#/components/schemas/General_id'
        messaggi:
          $ref: '#/components/schemas/Messages'
        
        
    Single_chat:
      description: |
        Oggetto che definisce la chat tra due persone
      allOf:
      - $ref: '#/components/schemas/Chat'
      - type: object
        properties:
          destinatario:
            $ref: '#/components/schemas/User'

    
    Group:
      description: |
        Oggetto che definisce un gruppo, comprende id, nome, lista dei partecipanti
        e foto del gruppo (facoltativa)
      allOf:
      - $ref: '#/components/schemas/Chat'
      - type: object
        properties:
          nome:
            type: string
            example: "Gruppo vacanze"
          partecipanti:
            type: array
            items:
              $ref: '#/components/schemas/User'
          foto:
            $ref: '#/components/schemas/Photo'
        required:
          - identificativo
          - nome
  
  
    Error:
      description: |
        Oggetto di risposta per codici di errore
      type: object
      properties:
        codice:
          type: string
          example: "Bad Request"
        messaggio:
          type: string
          example: "Manca l'oggetto da sostituire"
          
    
  
  
  parameters:
    user_id_param:
      name: user_id
      in: path
      description: Identificatore utente
      required: true
      schema: 
        $ref: '#/components/schemas/General_id'
        
    message_id_param:
      name: message_id
      in: path
      description: Identificatore messaggio
      required: true
      schema:
        $ref: '#/components/schemas/General_id'
    
    comment_id_param:
      name: comment_id
      in: path
      description: Identificatore risposta
      required: true
      schema:
        $ref: '#/components/schemas/General_id'
        
    group_id_param:
      name: group_id
      in: path
      description: Identificatore gruppo
      required: true
      schema:
        $ref: '#/components/schemas/General_id'
    
    chat_id_param:
      name: chat_id
      in: path
      description: Identificatore chat
      required: true
      schema: 
        $ref: '#/components/schemas/General_id'
        
        
  responses:
    BadRequest:
      description: Richiesta non fornita o errata
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
            
    NotFound:
      description: Risorsa non trovata
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      



paths:
  /session:
    post:
      tags: ["login"]
      operationId: doLogin
      summary: Logs in the user
      description: |
        If the user does not exist, it will be created,
        and an identifier is returned.
        If the user exists, the user identifier is returned
      requestBody:
        description: User details
        required: true
        content:
          application/json:
            schema:
                type: object
                properties:
                  name:
                    type: string
                    example: Maria
                    pattern: '^.*?$'
                    minLength: 3
                    maxLength: 16
      responses:
        "201":
          description: User log-in action succesful
          content:
            application/json:
              schema:
                type: object
                properties:
                  identifier:
                    type: string
                    example: "abcdef012345"
                
  /me/username: 
    put:
      operationId: setMyUsername
      summary: Aggiornamento del nickname dell'utente
      description: |
        Sostituisce il nickname dell'utente
      requestBody:
        description: |
          Oggetto con nickname da sostituire con il precedente
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Object_id'
      responses:
        "200":
          description: Aggiornamento avvenuto con successo e oggetto restituito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Object_id'
        "400":
          $ref: '#/components/responses/BadRequest'
                
  /me/photo:
    put:
      operationId: setMyPhoto
      summary: Aggiorna foto
      description: |
        Aggiorna la foto profilo dell'utente
      requestBody:
        description: Foto da aggiornare
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Photo'
      responses:
        "200":
          description: Foto profilo aggiornata con successo
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/User'
        "400":
          $ref: '#/components/responses/BadRequest'
              
              
                    
  /me/chats:
    get:
      operationId: getMyConversations
      summary: Elenca chat
      description: |
        Elenca tutte le chat dell'utente in ordine cronologico inverso
      responses:
        "200":
          description: Elenco delle chat restituito con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat_list'
        "404":
          $ref: '#/components/responses/NotFound'
  
                
  /me/chats/{chat_id}/messages:
    parameters:
      - $ref: '#/components/parameters/chat_id_param'
    get:
      operationId: getConversation
      summary:  Restituisce una chat
      description: |
        Restituisce la chat con uno specifico utente/gruppo
      responses:
        "200":
          description: Chat restituita con successo
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/Chat'
        "404":
          $ref: '#/components/responses/NotFound'
    post:
      operationId: sendMessage
      summary: Invio messaggio
      description: |
        Invio di un messaggio in una chat
      requestBody:
        description: Messaggio da inviare
        required: true
        content: 
          application/json:
            schema:
              $ref: '#/components/schemas/Message'
      responses:
        "200":
          description: Messaggio inviato con successo
          
  /me/chats/{chat_id}/messages/{message_id}:
    parameters:
      - $ref: '#/components/parameters/chat_id_param'
      - $ref: '#/components/parameters/message_id_param'
      
    delete:
      operationId: deleteMessage
      summary: Eliminazione messaggio
      description: |
        Elimina tramite id un specifico messaggio in una chat
      responses:
        "204":
          description: Commento eliminato con successo
      
          
  /me/chats/{chat_id}/messages/{message_id}/forward:
    parameters:
      - $ref: '#/components/parameters/chat_id_param'
      - $ref: '#/components/parameters/message_id_param'
    
    post:
      operationId: forwardMessage
      summary: Inoltro messaggio
      description: |
        Preso un messaggio da una chat, inoltra il messaggio specificando l'identificativo della chat
      requestBody:
        description: Destinatario del messaggio da inoltrare
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                forwarding_user_id:
                  type: string
      responses:
        "200":
          description: Messaggio inoltrato con successo
                
  /me/chats/{chat_id}/messages/{message_id}/comment:
    parameters:
      - $ref: '#/components/parameters/chat_id_param'
      - $ref: '#/components/parameters/message_id_param'
    
    post:
      operationId: commentMessage
      summary: Commento messaggio
      description: |
        Preso un messaggio da una chat, risponde al messaggio commentando con 
        un ulteriore messaggio sulla stessa chat
      requestBody:
        description: Messaggio con cui rispondere
        required: true
        content: 
          application/json:
            schema:
              $ref: '#/components/schemas/Message'
      responses:
        "200": 
          description: Risposta inviata con successo
        
                
                
  /me/chats/{chat_id}/messages/{message_id}/comment/{comment_id}:
    parameters:
      - $ref: '#/components/parameters/chat_id_param'
      - $ref: '#/components/parameters/message_id_param'
      - $ref: '#/components/parameters/comment_id_param'
      
    delete:
      operationId: uncommentMessage
      summary: Eliminazione commento
      description: |
        Elimina tramite id lo specifico commento di uno 
        specifico messaggio
      responses:
        "204":
          description: Commento eliminato con successo
          
          
  /me/chats/groups:
    post:
      operationId: createGroup
      summary: Crea gruppo
      description: |
        Crea gruppo assegnando id, nome e foto profilo (facoltativa)
      requestBody:
        description: Nome e foto del gruppo
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Group'
      responses:
        "201":
          description: Gruppo creato con successo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
                
                

          
  
  /me/chats/groups/{group_id}/name:
    parameters:
      - $ref: '#/components/parameters/group_id_param'
    put:
      operationId: setGroupName
      summary: Aggiorna nome gruppo
      description: |
        Aggiorna il nome di un determinato gruppo
      requestBody:
        description: Nome da assegnare al gruppo
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nome:
                  type: string
                  example: "gruppo università"
      responses:
        "200":
          description: Nome del gruppo aggiornato
          
          
  /me/chats/groups/{group_id}/photo:
    parameters:
      - $ref: '#/components/parameters/group_id_param'
  
    put:
      operationId: setGroupPhoto
      summary: Aggiorna foto del gruppo
      description: |
        Aggiorna la foto profilo del gruppo
      requestBody:
        description: Foto da aggiornare
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Photo'
      responses:
        "200":
          description: Foto profilo aggiornata con successo
      
  
          
  /me/chats/groups/{group_id}/members:
    parameters:
      - $ref: '#/components/parameters/group_id_param'

    post:
      operationId: addToGroup
      summary: Aggiungi al gruppo
      description: |
        Inserisce un utente in un gruppo
      requestBody:
        description: Utente da inserire nel gruppo
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/General_id'
      responses:
        "200":
          description: Utente aggiunto al gruppo con successo
  
    delete:
      operationId: leaveGroup
      summary: Abbandona gruppo
      description: |
        L'utente corrente abbandona il gruppo
      responses:
        "204":  
          description: L'utente ha abbandonato il gruppo correttamente
