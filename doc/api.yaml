openapi: 3.0.0
info:
  title: WASAText
  description: |
    Messaging platform that supports individual and group chats, accessible via PC.
  version: 1.0.0

components:
  schemas:
    User:
      description: User object
      type: object
      properties:
        userId: 
          $ref: '#/components/schemas/GeneralId'
        name:
          type: string
          description: User nickname
          example: "Luca"
          pattern: '^.*?$'
          minLength: 3
          maxLength: 25
        photo:
          $ref: '#/components/schemas/Photo'
      required:
      - userId
    
    Photo:
      description: User or group profile photo
      type: object
      properties:
        url:
          type: string
          description: URL of the photo
          format: url
          pattern: '^.*?$'
          minLength: 1
          maxLength: 1000
          example: "https://foto.com/foto.png"
          
    GeneralId:
      description: Defines the format for identifiers
      type: string
      example: "avfd457ud3"
      minLength: 3
      maxLength: 16
      pattern: '^.*?$'
          
    ChatList:
      description: Chat list in reverse chronological order
      type: object
      properties:
        chats:
          description: List of chats preview
          type: array
          minItems: 0
          maxItems: 1000
          items:
            $ref: '#/components/schemas/ChatPreview'
        
    ChatPreview:
      description: |
        Chat preview object showing name, photo, last message and its sending time
      type: object
      properties:
        id:
          $ref: '#/components/schemas/GeneralId'
        name:
          type: string
          description: Chat name (user nickname or group name)
          pattern: '^.*?$'
          minLength: 3
          maxLength: 25
          example: "Luca"
        photo:
          $ref: '#/components/schemas/Photo'
        lastMessage:
          $ref: '#/components/schemas/Message'
        
    Message:
      description: Message object
      type: object
      properties: 
        id:
          $ref: '#/components/schemas/GeneralId'
        sender:
          $ref: '#/components/schemas/User'
        text:
          type: string
          description: Message content
          pattern: '^.*?$'
          example: "ciao"
          minLength: 1
          maxLength: 1000
        instant:
          type: string
          minLength: 1
          maxLength: 100
          description: Message sending time
          format: date-time
        comments:
          type: array
          description: List of reactions to the message
          minItems: 0
          maxItems: 100
          items:
            $ref: '#/components/schemas/Comment'
        state:
          type: integer
          description: Message state (1 = received, 2 = read)
          enum: 
            - 1
            - 2
      required:
        - text
       
    
    Comment:
      description: Reaction object
      type: object
      properties:
        id: 
          $ref: '#/components/schemas/GeneralId'
        sender:
          $ref: '#/components/schemas/User'
        emoji:
          type: string
          description: Emoji used to react to the message
          example: "👍"
          pattern: '^[^\\s]{1,10}$'
          minLength: 1
          maxLength: 10
      required: 
        - emoji
    
    Messages:
      description: List of messages in reverse chronological order
      type: object
      properties:
        messages:
          type: array
          description: List of messages in reverse chronological order
          minItems: 0
          items:
            $ref: '#/components/schemas/Message'
        
    Chat:
      description: Generic chat object (single or group chat)
      type: object
      properties:
        id: 
          $ref: '#/components/schemas/GeneralId'
        isGroup:
          type: boolean
          description: True if the chat is a group chat, false if it is a single chat
        name:
          type: string
          description: Chat name (user nickname or group name)
          pattern: '^.*?$'
          minLength: 3
          maxLength: 25
          example: "Luca"
        photo:
          $ref: '#/components/schemas/Photo'
        participants:
          type: array
          description: List of participants in the chat
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/User'
        messages:
          $ref: '#/components/schemas/Messages'
  
    Error:
      description: Response subject for error codes
      type: object
      properties:
        code:
          description: Error code
          type: string
          pattern: '^.*?$'
          example: "Bad Request"
          minLength: 3
          maxLength: 50
        message:
          description: Error message
          type: string
          pattern: '^.*?$'
          example: "Missing request"
          minLength: 3
          maxLength: 100
          
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
          
  parameters:
    messageIdParam:
      name: messageId
      in: path
      description: Message identifier
      required: true
      schema:
        $ref: '#/components/schemas/GeneralId'
    
    commentIdParam:
      name: commentId
      in: path
      description: Reaction identifier
      required: true
      schema:
        $ref: '#/components/schemas/GeneralId'
    
    chatIdParam:
      name: chatId
      in: path
      description: Chat identifier
      required: true
      schema: 
        $ref: '#/components/schemas/GeneralId'
        
        
  responses:
    BadRequest:
      description: Missing request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
            
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
            
    UnauthorizedError:
      description: Access token is missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      
security:
  - bearerAuth: []

tags:
  - name: "login"
    description: "Login operations"
  - name: "user"
    description: "User operations"
  - name: "chat"
    description: "Chat operations"
  - name: "message"
    description: "Message operations"
  - name: "comment"
    description: "Comment operations"
  - name: "group"
    description: "Group operations"


paths:
  /session:
    post:
      tags: ["login"]
      operationId: doLogin
      summary: Logs in the user
      description: |
        If the user does not exist, it will be created,
        and an identifier is returned.
        If the user exists, the user identifier is returned
      requestBody:
        description: User details
        required: true
        content:
          application/json:
            schema:
                type: object
                properties:
                  name:
                    description: User nickname
                    type: string
                    example: Maria
                    pattern: '^.*?$'
                    minLength: 3
                    maxLength: 16
      responses:
        "201":
          description: User log-in action succesful
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    $ref: '#/components/schemas/GeneralId'
        "400":
          $ref: '#/components/responses/BadRequest'
        "500":
          $ref: '#/components/responses/InternalServerError'
                
  /me/username: 
    patch:
      tags: ["user"]
      operationId: setMyUserName
      summary: Update the user's nickname
      description: |
        Update the user's nickname and returns it
      requestBody:
        description: |
          New nickname to be replaced with the old one
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  description: New nickname
                  type: string
                  minLength: 3
                  maxLength: 25
                  pattern: '^.*?$'
                  example: "New username"
      responses:
        "200":
          description: Update successful and nickname returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  username:
                    description: Updated nickname
                    type: string
                    minLength: 3
                    maxLength: 25
                    pattern: '^.*?$'
                    example: "New username"
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "500":
          $ref: '#/components/responses/InternalServerError'
      
      security:
        - bearerAuth: []
             
                
  /me/photo:
    put:
      tags: ["user"]
      operationId: setMyPhoto
      summary: Update the user's photo
      description: |
        Update the user's photo and returns it
      requestBody:
        description: New photo to be replaced with the old one 
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Photo'
      responses:
        "200":
          description: Photo updated successfully
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/Photo'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "500":
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: []
              
                    
  /chats:
    get:
      tags: ["chat"]
      operationId: getMyConversations
      summary: List all chats
      description: |
        Lists all the user's chats in reverse chronological order
      responses:
        "200":
          description: Chat list returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatList'
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "500":
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: []

    post:
      tags: ["chat"]
      operationId: createChat
      summary: Create a chat
      description: |
        Create a chat with a specific user or group
      requestBody:
        description: User or group to create a chat with
        required: true
        content:
          application/json:
            schema:
              description: User or group type of conversation
              type: object
              properties:
                type:
                  description: Type of conversation to create (true for group, false for user)
                  type: boolean 
                participants:
                  description: User or group to create a chat with
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    $ref: '#/components/schemas/GeneralId'
                name:
                  description: Group name (only for group chats)
                  type: string
                  pattern: '^.*?$'
                  minLength: 3
                  maxLength: 25
                  example: "Group name"
      responses:
        "201":
          description: Chat created successfully and returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "500":
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: []
  
                
  /chats/{chatId}/messages:
    parameters:
      - $ref: '#/components/parameters/chatIdParam'
    get:
      tags: ["message"]
      operationId: getConversation
      summary:  Returns the messages of a chat
      description: |
        Returns the messages of a group or a chat with a specific user
      responses:
        "200":
          description: Messages returned successfully
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/Messages'
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'
      security:
        - bearerAuth: []
     
    post:
      tags: ["message"]
      operationId: sendMessage
      summary: Send a message
      description: |
        Send a message in chat
      requestBody:
        description: Message to send
        required: true
        content: 
          application/json:
            schema:
              description: Message object to send
              type: object
              properties:
                text:
                  description: Message content
                  type: string
                  pattern: '^.*?$'
                  example: "ciao"
                  minLength: 1
                  maxLength: 1000
      responses:
        "201":
          description: Message sent successfully and returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "404":
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: []
          
          
  /chats/{chatId}/messages/{messageId}:
    parameters:
      - $ref: '#/components/parameters/chatIdParam'
      - $ref: '#/components/parameters/messageIdParam'

    delete:
      tags: ["message"]
      operationId: deleteMessage
      summary: Delete a message
      description: |
        Delete a specific chat message by id
      responses:
        "204":
          description: Message successfully deleted
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "404":
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: []
      
      
  /chats/{chatId}/messages/{messageId}/forward:
    parameters:
      - $ref: '#/components/parameters/chatIdParam'
      - $ref: '#/components/parameters/messageIdParam'

    post:
      tags: ["message"]
      operationId: forwardMessage
      summary: Forward a message
      description: |
        Receiving a message from a chat, forward the message specifying the chat ID
      requestBody:
        description: Recipient of the forwarded message
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  $ref: '#/components/schemas/GeneralId'
              required:
                - userId
      responses:
        "201":
          description: Message forwarded successfully and returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "404":
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: []
                
                
  /chats/{chatId}/messages/{messageId}/comments:
    parameters:
      - $ref: '#/components/parameters/chatIdParam'
      - $ref: '#/components/parameters/messageIdParam'

    post:
      tags: ["comment"]
      operationId: commentMessage
      summary: Comment a message
      description: |
        reacts to a message with emojis
      requestBody:
        description: Emoji to react with
        required: true
        content: 
          application/json:
            schema:
              $ref: '#/components/schemas/Comment'
      responses:
        "201": 
          description: Reaction sent successfully and returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "404":
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: []
        
                
                
  /chats/{chatId}/messages/{messageId}/comments/{commentId}:
    parameters:
      - $ref: '#/components/parameters/chatIdParam'
      - $ref: '#/components/parameters/messageIdParam'
      - $ref: '#/components/parameters/commentIdParam'

    delete:
      tags: ["comment"]
      operationId: uncommentMessage
      summary: Delete a reaction
      description: |
        Delete a specific reaction by id
      responses:
        "204":
          description: Reaction successfully deleted
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "404":
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: []
  
  /chats/{chatId}/name:
    parameters:
      - $ref: '#/components/parameters/chatIdParam'
    patch:
      tags: ["group"]
      operationId: setGroupName
      summary: Update the group name
      description: |
        Update the name of a specific group
      requestBody:
        description: New group name
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  description: New group name
                  type: string
                  minLength: 3
                  maxLength: 25
                  pattern: '^.*?$'
                  example: "New group name"
      responses:
        "200":
          description: Group name updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat' #Cambialo e ritorna il nuovo nome
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "404":
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: []
                
          
  /chats/{chatId}/photo:
    parameters:
      - $ref: '#/components/parameters/chatIdParam'
    put:
      tags: ["group"]
      operationId: setGroupPhoto
      summary: Update group photo
      description: |
        Update the group profile photo
      requestBody:
        description: New photo
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Photo'
      responses:
        "200":
          description: Photo updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Photo'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "404":
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: []

          
  /chats/{chatId}/members:
    parameters:
      - $ref: '#/components/parameters/chatIdParam'
    post:
      tags: ["group"]
      operationId: addToGroup
      summary: Add user to a group
      description: |
        Add user to a group
      requestBody:
        description: User to put in the group
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeneralId'
      responses:
        "201":
          description: User added to group successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralId'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "404":
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: []
  
    delete:
      tags: ["group"]
      operationId: leaveGroup
      summary: Leave the group
      description: |
        The current user leaves the group
      responses:
        "204":  
          description: The user has successfully left the group
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "404":
          $ref: '#/components/responses/NotFound'
      security:
        - bearerAuth: []
        
